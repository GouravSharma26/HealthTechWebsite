version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: healthtech_db
      POSTGRES_USER: healthtech_user
      POSTGRES_PASSWORD: supersecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
