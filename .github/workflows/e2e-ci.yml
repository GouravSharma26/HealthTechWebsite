name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install Playwright and dependencies
      working-directory: ./e2e
      run: |
        npm ci
        npx playwright install --with-deps
        
    - name: Setup Database and Run Django Server
      run: |
        # Set up a fresh database
        rm -f db.sqlite3
        python manage.py makemigrations
        python manage.py migrate
        # Start a local Redis server using Docker for Channels/WebSockets
        docker run -d -p 6379:6379 redis:alpine
        # Generate fixtures
        python create_e2e_fixtures.py
        # Load fixtures
        python manage.py loaddata e2e_fixtures.json
        # Start Daphne server in the background
        python -m daphne -b 127.0.0.1 -p 8000 healthtech.asgi:application &
        # Wait for Daphne to be ready
        sleep 5
      
    - name: Run E2E Tests
      working-directory: ./e2e
      env:
        E2E_BASE_URL: http://127.0.0.1:8000
      run: npx playwright test
      
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: e2e/playwright-report/
        retention-days: 30
