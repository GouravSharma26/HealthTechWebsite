databases:
  - name: healthtech_db
    databaseName: healthtech
    user: healthtech_user
    plan: free

services:
  - type: web
    name: healthtech-web
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn healthtech.asgi:application -k uvicorn.workers.UvicornWorker --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthtech_db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: healthtech-redis
          type: redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "healthtech-web.onrender.com"

  - type: redis
    name: healthtech-redis
    plan: free
