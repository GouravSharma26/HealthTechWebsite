# The database lives on Neon (external Postgres): Render's free Postgres expires after 30 days.
# Set DATABASE_URL in the Render dashboard (Environment tab) to the Neon connection string.

services:
  - type: web
    name: healthtech-web
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn healthtech.asgi:application -k uvicorn.workers.UvicornWorker --timeout 120"
    envVars:
      - key: DATABASE_URL
        sync: false   # secret: set by hand in the dashboard (Neon connection string)
      - key: PYTHON_VERSION
        value: 3.12.11   # match CI (3.12); Render's default is now 3.14
      - key: REDIS_URL
        fromService:
          name: healthtech-redis
          type: redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "healthtech-web.onrender.com"

  - type: redis
    name: healthtech-redis
    plan: free
