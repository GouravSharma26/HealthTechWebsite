{% extends 'core/base.html' %}
{% load static %}

{% block title %}Contact Us - HealthTech{% endblock %}

{% block content %}
<div class="content mt-4 mb-4" style="max-width: 600px; margin: 0 auto;">
  <h2 class="text-center" style="color: var(--primary); margin-bottom: 30px;">Contact Us</h2>
  
  <div class="card">
    <form method="POST" action="">
      {% csrf_token %}
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" placeholder="Enter your name" required>
      </div>
      <div class="form-group">
        <label>Your Email</label>
        <input type="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea rows="5" placeholder="How can we help you?" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px;">Send Message</button>
    </form>
  </div>
</div>
{% endblock %}
