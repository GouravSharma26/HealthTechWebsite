{% extends 'core/base.html' %}
{% load static %}

{% block title %}Signup - HealthTech{% endblock %}

{% block content %}
<div class="content mt-4 mb-4" style="max-width: 600px; margin: 0 auto;">
  <h2 class="text-center" style="color: var(--primary); margin-bottom: 30px;">Create an Account</h2>
  
  <div class="card">
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <button type="button" id="btn-patient" class="btn btn-primary" style="flex: 1;" onclick="document.getElementById('role').value='patient'; this.classList.add('btn-primary'); this.classList.remove('btn-outline'); document.getElementById('btn-doc').classList.add('btn-outline'); document.getElementById('btn-doc').classList.remove('btn-primary');">Patient</button>
      <button type="button" id="btn-doc" class="btn btn-outline" style="flex: 1;" onclick="document.getElementById('role').value='doctor'; this.classList.add('btn-primary'); this.classList.remove('btn-outline'); document.getElementById('btn-patient').classList.add('btn-outline'); document.getElementById('btn-patient').classList.remove('btn-primary');">Doctor</button>
    </div>

    <form method="POST" action="">
      {% csrf_token %}
      <input type="hidden" id="role" name="role" value="patient">
      
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Choose a username" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" name="phone_number" placeholder="Enter your phone number" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Create a password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 1.1rem;">Sign Up</button>
    </form>
    
    <p class="text-center" style="margin-top: 20px; color: var(--text-muted);">
      Already have an account? <a href="{% url 'login' %}" style="color: var(--primary); font-weight: 500;">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
