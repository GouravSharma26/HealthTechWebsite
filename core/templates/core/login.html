{% extends 'core/base.html' %}
{% load static %}

{% block title %}Login - HealthTech{% endblock %}

{% block content %}
<div class="content mt-4 mb-4" style="max-width: 500px; margin: 0 auto;">
  <h2 class="text-center" style="color: var(--primary); margin-bottom: 30px;">Welcome Back</h2>
  
  <div class="card">
    <form method="POST" action="">
      {% csrf_token %}
      
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 1.1rem;">Login</button>
    </form>
    
    <p class="text-center" style="margin-top: 20px; color: var(--text-muted);">
      Don't have an account? <a href="{% url 'signup' %}" style="color: var(--primary); font-weight: 500;">Sign up here</a>
    </p>
  </div>
</div>
{% endblock %}
